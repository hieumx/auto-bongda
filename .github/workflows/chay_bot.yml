name: Tự Động Săn Link Bóng Đá Hằng Ngày

on:
  schedule:
    # Chạy đều đặn mỗi 30 phút để luôn có luồng trực tiếp mới nhất
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép kích hoạt thủ công từ giao diện GitHub

concurrency:
  group: update-links
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Kéo mã nguồn về máy chủ
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Cài đặt Python & Kích hoạt Cache Pip
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Cài đặt thư viện & Playwright dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Kích hoạt Siêu Bot đi săn link
      # Chữ -u cực kỳ quan trọng để GitHub không bị nuốt log
      run: python -u san_link_bong_da.py

    - name: Đẩy file m3u mới lên kho chứa công khai
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add tong_hop_bong_da.m3u
        if ! git diff --staged --quiet; then
          git commit -m "Cập nhật luồng trực tiếp mới nhất [skip ci]"
          git pull --rebase origin main || true
          git push origin main
        else
          echo "Không có thay đổi nào trong danh sách phát"
        fi
